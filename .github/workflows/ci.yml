name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (includes a real stdio client-server round trip)
        run: pytest
      - name: Red-team suite (fails on any leak, write, or wrong verdict)
        run: make redteam
      - name: Scripted agent session
        run: make demo
