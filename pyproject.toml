[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-mcp"
version = "0.1.0"
description = "A governed Model Context Protocol server that lets AI agents query a data warehouse under role policies, column masking, SQL guardrails and an audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0,<3",
    "duckdb>=1.2",
    "sqlglot>=25",
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6"]

[project.scripts]
warehouse-mcp = "warehouse_mcp.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
